[project]
name = "cc-stats"
version = "0.1.0"
description = "Aggregate Claude Code session data and generate a GitHub profile SVG card"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
keywords = ["claude", "claude-code", "github", "profile", "stats", "svg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
cc-stats = "cc_stats.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
